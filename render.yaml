services:
  - type: web
    name: orbiscrm-global-enterprise
    runtime: python
    plan: free
    buildCommand: "python3 -c 'print("Build Ready")'"
    startCommand: "python3 server.py"
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: orbiscrm-postgres-db
          property: connectionString

databases:
  - name: orbiscrm-postgres-db
    databaseName: orbiscrm_prod
    user: crm_app_user
    plan: free
