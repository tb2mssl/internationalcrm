version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: orbiscrm_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_app_user
      POSTGRES_PASSWORD: crm_secure_password_2026
      POSTGRES_DB: orbiscrm_prod
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_100_international_leads.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data

  web:
    image: python:3.11-slim
    container_name: orbiscrm_web
    working_dir: /app
    volumes:
      - ./:/app
    command: python3 server.py
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
